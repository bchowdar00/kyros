[package]
name = "btc-feeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
crc32fast.workspace = true
futures-util.workspace = true
hmac.workspace = true
libc.workspace = true
reqwest.workspace = true
ring.workspace = true
rust_decimal.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signals-core = { path = "../signals-core" }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["cli"]
# The `btc-feeds` binary. A library consumer that only parses provider messages
# can turn it off (`default-features = false`) and drop clap and anyhow.
cli = ["dep:clap", "dep:anyhow"]
fuzzing = []

[[bin]]
name = "btc-feeds"
path = "src/main.rs"
required-features = ["cli"]

# Lints carried over from the signals prototype workspace (not this
# workspace's table, which is tuned for the exchange and compiler).
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
