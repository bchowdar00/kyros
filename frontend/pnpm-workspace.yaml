  "@mastra/observability": 1.17.5
  mastra: 1.27.3
  "@axe-core/playwright": 4.13.0
  "@number-flow/react": 0.6.2
  "@biomejs/biome": 2.5.11
  "@playwright/test": 1.62.1
  "@svgr/core": 8.1.0
  "@svgr/plugin-jsx": 8.1.0
  "@svgr/plugin-svgo": 8.1.0
  "@t3-oss/env-nextjs": 0.13.11
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-query": 5.102.8
  "@testing-library/dom": 10.4.1
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.6
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  axe-core: 4.13.0
  babel-plugin-react-compiler: 1.0.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  es-toolkit: 1.52.0
  fast-check: 4.9.0
  jsdom: 30.0.1
  knip: 6.34.0
  motion: 12.38.0
  msw: 2.15.0
  next: 16.3.4
  nuqs: 2.10.1
  oxlint: 1.80.0
  postcss: 8.5.26
  radix-ui: 1.6.7
  react: 19.2.8
  react-dom: 19.2.8
  react-grab: 0.2.0
  server-only: 0.0.1
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vitest: 4.1.11
  zod: 4.5.4
  zustand: 5.0.15

# pnpm applies a default minimum release age as a supply-chain guard. Entries here are
# releases we accepted before that window elapsed; pnpm appends them on install.
minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - next@16.3.4
  - knip@6.34.0

# Toolchain enforcement: refuse to install when Node is outside package.json#engines.
# The pnpm version itself is pinned by package.json#packageManager; a stale pnpm 9 is
# redirected to it by .npmrc, and pnpm >= 10 honours the pin natively.
engineStrict: true

# Install scripts are opt-in. Nothing here needs one: lefthook is installed by the root
# `prepare` script, msw's script only prints a notice, and the two native packages ship
# prebuilt binaries as optional dependencies.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  msw: false

# Mastra CLI currently requires the TypeScript 6 compiler API.
catalogs:
  mastra:
    typescript: 6.0.3
